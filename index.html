<style>

.approach-slot-right{border-top:3px solid #ef4444!important;border-bottom:3px solid #ef4444!important;border-right:3px solid #ef4444!important}
.manually-hidden{background:#fff!important;color:transparent!important;box-shadow:none!important;cursor:pointer}
@media(max-width:640px){header{gap:5px;padding-bottom:4px;margin-bottom:4px}.header-left{gap:6px}h1{font-size:clamp(.72rem,3.2vw,.95rem);line-height:1.1}.date-summary{font-size:clamp(.65rem,2.5vw,.82rem);gap:4px}.header-controls{justify-content:flex-end;gap:4px}.date-picker-wrapper{font-size:clamp(.62rem,2.5vw,.78rem);gap:3px}.date-picker-wrapper input{width:clamp(105px,34vw,140px);padding:2px 3px}.marquee-wrapper{font-size:clamp(.65rem,2.8vw,.85rem);padding:3px 0}col.time-column{width:19%}col.day-column{width:16.2%}.group-col-left{border-left-width:2px!important}.group-col-right{border-right-width:2px!important}}
@media(orientation:portrait){.container{position:fixed;top:0;left:100vw;width:100dvh;height:100vw;transform:rotate(90deg);transform-origin:top left}header{display:flex;align-items:center;justify-content:space-between}.header-left{flex-direction:row;gap:clamp(8px,2vw,20px)}.header-controls{width:auto;justify-content:flex-end}}
@media(max-height:460px){.container{padding-top:calc(2px + env(safe-area-inset-top));padding-bottom:calc(2px + env(safe-area-inset-bottom))}header{padding-bottom:2px;margin-bottom:2px}.header-controls{gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<body>
<div class="container">
  <div id="approaching-banner-top" class="marquee-wrapper marquee-ltr" role="status" aria-live="polite"><div class="marquee-content" id="top-marquee-text"></div></div>
  <header>
    <div class="header-left">
      <h1>教師個人時間表</h1>
      <div class="date-summary" aria-live="polite">
        <span id="current-date"></span>

    </div>

  </header>
  <div id="main-layout">
    <div id="eva-panel" class="eva-panel">
      <div class="eva-header-bar">
        <span>INTERNAL EMERGENCY ALERT</span>
        <span>CHY-00 SYSTEM</span>
      </div>
      <div class="eva-timer-main">
        <div class="eva-timer-title">
          <span>活動限界まで</span>
          <span style="font-size:0.65em;opacity:0.8;font-weight:normal;">ACTIVE TIME REMAINING:</span>
        </div>
        <div id="eva-timer-digits" class="eva-timer-digits">04:57:00</div>
        <div id="eva-target-class" class="eva-target-class">Chin 1D (204)</div>

</div>
<script>
const dayIndexToHeader={1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri'};
const defaultTimetable=[
  ['[時間]','Mon','Tue','Wed','Thu','Fri'],
  ['Home Room\n8:10 - 8:35','','','','',''],
  ['1\n8:35 - 9:10','Chin\n1A (201)','Chin\n1A (201)','','',''],
  ['2\n9:10 - 9:45','Chin\n1D (204)','','','',''],
  ['Recess 1\n9:45 - 10:00','','','','',''],
  ['3\n10:00 - 10:35','','','','',''],
  ['4\n10:35 - 11:10','','','','',''],
  ['Recess 2\n11:10 - 11:25','','','','',''],
  ['5\n11:25 - 12:00','','','Chin\n1D (204)','Chin\n1A (201)',''],
  ['6\n12:00 - 12:35','','','Chin\n1D (204)','Chin\n1A (201)',''],
  ['Lunch\n12:35 - 13:50','','','','',''],
  ['7\n13:50 - 14:25','','','Chin\n1A (201)','Chin\n1D (204)','Chin\n1D (204)'],
  ['8\n14:25 - 15:00','','','Chin\n1A (201)','Chin\n1D (204)','Chin\n1D (204)'],
  ['Recess 3\n15:00 - 15:05','','','','',''],
  ['9\n15:05 - 15:40','','','','',''],
  ['Recess 4\n15:40 - 15:50','','','','',''],
  ['10\n15:50 - 16:25','','','','','']
];
let manuallyHiddenCells={};let clickCountMap={};let lastClickedKey=null;let clickTimeout=null;
let customTimeOffset=0;
function formatDateString(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseMin(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function getSimulatedNow(){return new Date(Date.now()+customTimeOffset)}
function isTargetChinClass(content){if(!content)return false;return (/Chin/i.test(content)&&!/Chin\s*Meeting/i.test(content))||/^1D\s*\(204\)$/i.test(content.trim())}
function getTimeSlotStatus(timeStr,targetDateStr){
  const now=getSimulatedNow();
  if(targetDateStr!==formatDateString(now)||!timeStr||!timeStr.includes('-'))return{isLive:false,isApproaching:false,diffMs:0,diffSec:0};
  const match=timeStr.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
  if(!match)return{isLive:false,isApproaching:false,diffMs:0,diffSec:0};
  const startMin=parseMin(match[1]),endMin=parseMin(match[2]);
  const currentMs=(now.getHours()*3600+now.getMinutes()*60+now.getSeconds())*1000+now.getMilliseconds();
  const startMs=startMin*60*1000,endMs=endMin*60*1000;
  const isLive=currentMs>=startMs&&currentMs<endMs;
  const diffMs=startMs-currentMs,diffSec=diffMs/1000;
  // 倒數期間 + 結束後 10 秒仍保持 approaching 狀態以便平滑消失
  const isApproaching=diffSec<=300&&diffSec>=-10;
  return{isLive,isApproaching,diffMs,diffSec};
}
function formatMMSSMS(diffMs){
  if(diffMs<=0)return'00:00:00';
  const m=Math.floor(diffMs/60000),s=Math.floor((diffMs%60000)/1000),ms=Math.floor((diffMs%1000)/10);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(ms).padStart(2,'0')}`;
}
function updateLiveClock(){
  const now=getSimulatedNow();
  const h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0'),s=String(now.getSeconds()).padStart(2,'0');
  const clockEl=document.getElementById('current-time');
  clockEl.textContent=`${h}:${m}:${s}`;
  const resetBtn=document.getElementById('reset-time-btn');
  if(customTimeOffset!==0){
    clockEl.classList.add('is-simulated');
    clockEl.title='【模擬時間中】點擊重新修改';
    resetBtn.style.display='inline-block';
  }else{
    clockEl.classList.remove('is-simulated');
    clockEl.title='點擊修改測試時間';
    resetBtn.style.display='none';
  }
}
function fitTable(){
  const box=document.getElementById('table-container'),table=box.querySelector('table');
  if(!table)return;
  // 強制不換行 + 自動縮放字型，確保所有文字完整顯示且不穿格
  table.style.whiteSpace='nowrap';
  let size=16;
  table.style.fontSize=size+'px';
  const cells=[...table.querySelectorAll('th,td')];
  while(size>5){
    const overflow=box.scrollHeight>box.clientHeight+1||box.scrollWidth>box.clientWidth+1||table.scrollHeight>box.clientHeight+1||
                   cells.some(c=>c.scrollHeight>c.clientHeight+2||c.scrollWidth>c.clientWidth+2);
    if(!overflow)break;
    size-=0.5;
    table.style.fontSize=size+'px';
  }
}
/* EVA 面板文字自動縮放：對應表格大小，確保不換行、不穿格、完整顯示 */
function fitEvaPanel(){
  const panel=document.getElementById('eva-panel');
  if(!panel||panel.style.display==='none')return;
  // 取得表格目前的字型大小作為基準參考
  const table=document.querySelector('#table-container table');
  let baseSize=16;
  if(table){
    const fs=parseFloat(getComputedStyle(table).fontSize);
    if(!isNaN(fs))baseSize=fs;
  }
  // 先設為基準大小，再逐步縮小直到完全不溢出
  const elements=[
    {sel:'.eva-header-bar', ratio:0.7},
    {sel:'.eva-timer-title', ratio:0.85},
    {sel:'.eva-timer-digits', ratio:2.8},
    {sel:'.eva-target-class', ratio:0.9},
    {sel:'.eva-box-internal .title', ratio:1.1},
    {sel:'.eva-box-internal .sub', ratio:0.55},
    {sel:'.eva-box-power .title', ratio:0.75},
    {sel:'.eva-box-power .sub', ratio:0.5},
    {sel:'.eva-status-item', ratio:0.55}
  ];
  // 先設定初始字型
  elements.forEach(e=>{
    const els=panel.querySelectorAll(e.sel);
    els.forEach(el=>{el.style.fontSize=(baseSize*e.ratio)+'px';el.style.whiteSpace='nowrap';});
  });
  // 再針對整個面板與各區塊檢查溢出並縮小
  let scale=1.0;
  const checkOverflow=()=>{
    if(panel.scrollHeight>panel.clientHeight+2||panel.scrollWidth>panel.clientWidth+2)return true;
    const boxes=panel.querySelectorAll('.eva-timer-main,.eva-box-internal,.eva-box-power,.eva-header-bar,.eva-status-item,.eva-target-class,.eva-timer-digits,.eva-timer-title');
    for(const b of boxes){
      if(b.scrollHeight>b.clientHeight+2||b.scrollWidth>b.clientWidth+2)return true;
    }
    return false;
  };
  while(scale>0.35&&checkOverflow()){
    scale-=0.05;
    elements.forEach(e=>{
      const els=panel.querySelectorAll(e.sel);
      els.forEach(el=>{el.style.fontSize=(baseSize*e.ratio*scale)+'px';});
    });
  }
}
function handleCellClick(key){
  if(lastClickedKey!==key){clickCountMap={};lastClickedKey=key}
  clickCountMap[key]=(clickCountMap[key]||0)+1;
  if(clickTimeout)clearTimeout(clickTimeout);
  clickTimeout=setTimeout(()=>{clickCountMap[key]=0},1500);
  if(clickCountMap[key]>=3){
    manuallyHiddenCells[key]=!manuallyHiddenCells[key];
    clickCountMap[key]=0;
    renderSchedule();
  }
}
function onDateChanged(){manuallyHiddenCells={};renderSchedule()}
function updateStatusLights(diffSec){
  const normalEl=document.getElementById('eva-status-normal');
  const racingEl=document.getElementById('eva-status-racing');
  // 重置
  normalEl.classList.remove('active-normal');
  racingEl.classList.remove('active-racing');
  if(diffSec>240){ // 5~4 分鐘：只有 Normal 閃爍（現改為紅色）
    normalEl.classList.add('active-normal');
  }else if(diffSec>180){ // 4~3 分鐘：只有 Racing 閃爍
    racingEl.classList.add('active-racing');
  }else if(diffSec>0){ // 3 分鐘起：Racing 與 Normal 交替閃爍
    // 使用時間戳來決定當前該亮哪一個，造成交替效果
    const phase=Math.floor(Date.now()/700)%2; // 約 0.7 秒切換一次
    if(phase===0) racingEl.classList.add('active-racing');
    else normalEl.classList.add('active-normal');
  }else{ // 已開始後仍短暫保持緊急狀態
    racingEl.classList.add('active-racing');
  }
}
function renderSchedule(){
  updateLiveClock();
  const dateInputVal=document.getElementById('date-select').value;
  const selectedDate=dateInputVal?new Date(dateInputVal+'T00:00:00'):getSimulatedNow();
  const targetDay=selectedDate.getDay(),targetHeader=dayIndexToHeader[targetDay];
  const weekdays=['Mon','Tue','Wed','Thu','Fri'],targetIndex=weekdays.indexOf(targetHeader),hasTarget=targetIndex>=0;
  document.getElementById('current-date').textContent=formatDateString(selectedDate);
  document.getElementById('current-weekday').textContent=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][targetDay];
  let approaching=null;
  let approachingRowIndex=-1; // 記錄真正觸發 EVA 倒數的那一列
  for(let i=1;i<defaultTimetable.length;i++){
    const row=defaultTimetable[i],slot=row[0]||'',status=getTimeSlotStatus(slot,dateInputVal);
    const content=row[defaultTimetable[0].indexOf(targetHeader)]||'';
    if(hasTarget&&status.isApproaching&&content&&isTargetChinClass(content)){
      if(!approaching||status.diffMs<approaching.diffMs){
        approaching={name:content.replace(/\n/g,' '),diffMs:status.diffMs,diffSec:status.diffSec,slot:slot};
        approachingRowIndex=i;
      }
    }
  }
  const evaPanel=document.getElementById('eva-panel'),tableContainer=document.getElementById('table-container');
  let displayOrder=[];
  if(approaching){
    evaPanel.style.display='flex';
    if(targetDay===4){displayOrder=['時間','Thu','Fri'];evaPanel.style.order='1';tableContainer.style.order='2'}
    else if(targetDay===5){displayOrder=['時間','Fri'];evaPanel.style.order='1';tableContainer.style.order='2'}
    else if(targetDay===1){displayOrder=['時間','Mon'];evaPanel.style.order='2';tableContainer.style.order='1'}
    else if(targetDay===2){displayOrder=['時間','Mon','Tue'];evaPanel.style.order='2';tableContainer.style.order='1'}
    else if(targetDay===3){displayOrder=['時間','Mon','Tue','Wed'];evaPanel.style.order='2';tableContainer.style.order='1'}
    else{displayOrder=['時間',...weekdays];evaPanel.style.order='1';tableContainer.style.order='2'}
  }else{
    evaPanel.style.display='none';
    displayOrder=!hasTarget?['時間',...weekdays]:[...weekdays.slice(0,targetIndex),'時間',...weekdays.slice(targetIndex)];
  }
  // 保證「時間」欄永遠緊貼在當日欄左側
  if(hasTarget){
    const timeIndex=displayOrder.indexOf('時間');
    const dayIndex=displayOrder.indexOf(targetHeader);
    if(timeIndex>=0&&dayIndex>=0&&dayIndex!==timeIndex+1){
      displayOrder.splice(timeIndex,1);
      displayOrder.splice(displayOrder.indexOf(targetHeader),0,'時間');
    }
  }
  let html='<table aria-label="每週課堂時間表"><colgroup><col class="time-column">'+displayOrder.slice(1).map(()=>'<col class="day-column">').join('')+'</colgroup><thead><tr>';
  for(const h of displayOrder){
    const isTarget=h===targetHeader,isTime=h==='時間';
    let thClass='';
    if(hasTarget&&isTime)thClass='group-th-bg group-col-left group-col-top';
    else if(hasTarget&&isTarget)thClass='group-th-bg group-col-right group-col-top';
    html+=`<th class="${thClass}">${isTarget?`${h} (今日)`:h}</th>`;
  }
  html+='</tr></thead><tbody>';
  const totalRows=defaultTimetable.length;
  for(let i=1;i<totalRows;i++){
    const row=defaultTimetable[i],slot=row[0]||'',status=getTimeSlotStatus(slot,dateInputVal);
    const isLastRow=i===totalRows-1;
    const isLiveRow=hasTarget&&status.isLive;
    // ★ 關鍵修改：只有真正觸發 EVA 5分鐘倒數的那一列（approachingRowIndex）才套用紅色漸變
    const isThisApproachingRow = (approaching && i === approachingRowIndex && status.diffMs > 0);
    html+='<tr>';
    for(const h of displayOrder){
      const isTarget=h===targetHeader,isTime=h==='時間';
      const content=row[defaultTimetable[0].indexOf(h)]||'';
      const key=`${dateInputVal}_${i}_${h}`,hidden=!!manuallyHiddenCells[key];
      const isChin=isTargetChinClass(content);
      let groupClass='';
      if(hasTarget){
        if(isTime)groupClass=' group-bg group-col-left'+(isLastRow?' group-col-bottom':'');
        else if(isTarget)groupClass=' group-bg group-col-right'+(isLastRow?' group-col-bottom':'');
      }
      // 時間欄
      if(isTime){
        let liveTimeClass=' time-col';
        if(isLiveRow) liveTimeClass=' current-live-cell live-slot-left';
        else if(isThisApproachingRow) liveTimeClass=' is-approaching approach-slot-left'; // 只標示真正的預備時間
        html+=`<td class="${liveTimeClass}${groupClass}">${slot.replace(/\n/g,'<br>')}</td>`;
        continue;
      }
      // 課堂欄
      let stateClass='';
      if(isTarget&&status.isLive){
        stateClass=' current-live-cell live-slot-right';
      }else if(isThisApproachingRow && isChin){ // 只標示真正的預備課堂
        stateClass=' is-approaching approach-slot-right';
      }
      if(!content){
        // 空白格：只有真正的預備時間列才一起標示紅色，其他情況不標示
        if(isTarget&&status.isLive){
          html+=`<td class="current-live-cell live-slot-right${groupClass}"></td>`;
        }else if(isThisApproachingRow){
          html+=`<td class="is-approaching approach-slot-right${groupClass}"></td>`;
        }else{
          html+=`<td class="free-slot${groupClass}"></td>`;
        }
      }else if(hidden){
        html+=`<td class="manually-hidden${groupClass}" onclick="handleCellClick('${key}')" aria-label="已隱藏的課堂，連點三次還原"></td>`;
      }else{
        const tintClass=/1A\s*\(201\)/i.test(content)?' class-1a':/1D\s*\(204\)/i.test(content)?' class-1d':'';
        const bgClass=stateClass?'':' active-class'+tintClass;
        html+=`<td class="${bgClass}${groupClass}${stateClass}" onclick="handleCellClick('${key}')" title="連點三次可隱藏或還原">${content.replace(/\n/g,'<br>')}</td>`;
      }
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  document.getElementById('table-container').innerHTML=html;
  // 跑馬燈與 EVA 面板
  const bannerTop=document.getElementById('approaching-banner-top');
  const bannerBottom=document.getElementById('approaching-banner-bottom');
  const topText=document.getElementById('top-marquee-text');
  const bottomText=document.getElementById('bottom-marquee-text');
  if(approaching){
    bannerTop.style.display='block';
    bannerBottom.style.display='block';
    const formattedDigits=formatMMSSMS(approaching.diffMs);
    document.getElementById('eva-timer-digits').textContent=formattedDigits;
    document.getElementById('eva-target-class').textContent=approaching.name;
    // 狀態燈邏輯
    updateStatusLights(approaching.diffSec);
    let alertMsg='',phaseClass='';
    if(approaching.diffSec>120){
      document.body.classList.remove('emergency-critical');
      evaPanel.classList.remove('critical-mode');
      phaseClass='phase-1';
      alertMsg=`緊急事態非常警報令 EMERGENCY &nbsp;&bull;&nbsp; ⚠️ 情報確認 &nbsp;&bull;&nbsp; 快將上課！[${approaching.name}] &nbsp;&bull;&nbsp; ⏱️ 倒數 ${formattedDigits} &nbsp;&bull;&nbsp; `;
    }else if(approaching.diffSec>0){
      document.body.classList.add('emergency-critical');
      evaPanel.classList.add('critical-mode');
      phaseClass='phase-2';
      alertMsg=`🚨 極限警報 CRITICAL ALERT &nbsp;&bull;&nbsp; ⚠️ 非常事態 &nbsp;&bull;&nbsp; [${approaching.name}] 即將開始！ &nbsp;&bull;&nbsp; ⏱️ 倒數 ${formattedDigits} &nbsp;&bull;&nbsp; `;
    }else{
      document.body.classList.add('emergency-critical');
      evaPanel.classList.add('critical-mode');
      phaseClass='phase-2';
      const postSec=(Math.abs(approaching.diffMs)/1000).toFixed(1);
      alertMsg=`🚨 課堂已開始 CLASS STARTED &nbsp;&bull;&nbsp; [${approaching.name}] &nbsp;&bull;&nbsp; ⏱️ 已開始 ${postSec} 秒 &nbsp;&bull;&nbsp; `;
    }
    bannerTop.className=`marquee-wrapper marquee-ltr ${phaseClass}`;
    bannerBottom.className=`marquee-wrapper marquee-rtl ${phaseClass}`;
    const repeatedContent=`<span>${alertMsg.repeat(4)}</span><span>${alertMsg.repeat(4)}</span>`;
    topText.innerHTML=repeatedContent;
    bottomText.innerHTML=repeatedContent;
  }else{
    document.body.classList.remove('emergency-critical');
    evaPanel.classList.remove('critical-mode');
    bannerTop.style.display='none';
    bannerBottom.style.display='none';
    topText.innerHTML='';
    bottomText.innerHTML='';
    // 清除狀態燈
    document.getElementById('eva-status-normal').classList.remove('active-normal');
    document.getElementById('eva-status-racing').classList.remove('active-racing');
  }
  requestAnimationFrame(()=>{
    fitTable();
    fitEvaPanel();
  });
}
document.getElementById('current-time').addEventListener('click',()=>{
  const currentNow=getSimulatedNow();
  const defaultVal=`${String(currentNow.getHours()).padStart(2,'0')}:${String(currentNow.getMinutes()).padStart(2,'0')}:${String(currentNow.getSeconds()).padStart(2,'0')}`;
  const input=prompt('【測試功能】請輸入欲模擬的時間 (格式 HH:MM:SS 或 HH:MM)：\n例如輸入 14:23:10 可測試最後 2 分鐘全紅閃爍與毫秒倒數',defaultVal);
  if(input!==null&&input.trim()!==''){
    const parts=input.trim().split(':').map(Number);
    if(parts.length>=2&&!isNaN(parts[0])&&!isNaN(parts[1])){
      const h=parts[0],m=parts[1],s=parts[2]||0;
      const targetDate=new Date(currentNow);
      targetDate.setHours(h,m,s,0);
      customTimeOffset=targetDate.getTime()-Date.now();
      renderSchedule();
    }else alert('時間格式不正確，請使用 HH:MM 或 HH:MM:SS');
  }
});
document.getElementById('reset-time-btn').addEventListener('click',()=>{customTimeOffset=0;renderSchedule()});
function setTestWeekday(){
  const dateInput=document.getElementById('date-select');
  const simulatedNow=getSimulatedNow();
  const selectedDate=dateInput.value?new Date(dateInput.value+'T00:00:00'):new Date(simulatedNow);
  const currentDay=selectedDate.getDay();
  const answer=prompt('【測試功能】請輸入要測試的星期：0=星期日、1=星期一、2=星期二、3=星期三、4=星期四、5=星期五、6=星期六；也可輸入「星期一」等。測試會同步模擬日期與時間，並觸發與實際相同的課堂預警、倒數及警報。',String(currentDay));
  if(answer===null||answer.trim()==='')return;
  const cleaned=answer.trim().replace(/^星期|^週/,'');
  const dayMap={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
  const requestedDay=/^[0-6]$/.test(cleaned)?Number(cleaned):dayMap[cleaned];
  if(requestedDay===undefined){alert('輸入無效，請輸入 0 至 6，或「星期一」至「星期日」。');return;}
  selectedDate.setDate(selectedDate.getDate()+requestedDay-currentDay);
  selectedDate.setHours(simulatedNow.getHours(),simulatedNow.getMinutes(),simulatedNow.getSeconds(),simulatedNow.getMilliseconds());
  customTimeOffset=selectedDate.getTime()-Date.now();
  dateInput.value=formatDateString(selectedDate);
  onDateChanged();
}
const weekdayPicker=document.getElementById('current-weekday');
weekdayPicker.addEventListener('click',setTestWeekday);
weekdayPicker.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();setTestWeekday()}});
const dateInput=document.getElementById('date-select');
dateInput.value=formatDateString(getSimulatedNow());
dateInput.addEventListener('change',onDateChanged);
renderSchedule();
setInterval(renderSchedule,30);
window.addEventListener('resize',()=>requestAnimationFrame(()=>{fitTable();fitEvaPanel();}));
if('ResizeObserver'in window){
  new ResizeObserver(()=>requestAnimationFrame(()=>{fitTable();fitEvaPanel();})).observe(document.getElementById('table-container'));
  new ResizeObserver(()=>requestAnimationFrame(fitEvaPanel)).observe(document.getElementById('eva-panel'));
}
</script>
</body>
